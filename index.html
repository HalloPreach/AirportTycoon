<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Airport Tycoon</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #050807; }
    canvas { display: block; }
    /* UI fine : barre d'outils de construction + toasts (feedback lisible). */
    /* R20 : barre de commandes du MENU en haut (boutons souris ; les raccourcis
       N/R restent disponibles). La toolbar de construction reste en bas à
       gauche et reçoit les boutons de commandes du jeu (pause, vitesse,
       sauvegarde, reprise) — les raccourcis P/F/S/L complètent la souris. */
    .menu-btns {
      position: fixed; left: 50%; top: 12px; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; gap: 6px; z-index: 10;
      justify-content: center; max-width: 92vw;
    }
    .menu-btns .tool {
      background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 6px 12px; cursor: pointer; font: 14px 'Courier New', monospace;
    }
    /* T2-1 (t_d5da994c) : SÉLECTION DE DIFFICULTÉ du menu — une rangée qui
       RÉUTILISE les boutons .menu-btns .tool (pas de style duplicaté) ; le
       bouton SÉLECTIONNÉ est mis en valeur par aria-pressed (pattern R43). */
    .menu-diff { display: flex; gap: 4px; align-items: center; }
    .menu-diff .menu-diff-label { color: var(--at-text-dim); font: 14px 'Courier New', monospace; }
    .menu-btns .tool[aria-pressed="true"] { background: var(--at-accent); color: #050807; border-color: var(--at-accent); }
    .toolbar {
      position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px;
      background: rgba(5,8,7,0.82); border: 1px solid var(--at-border); border-radius: 3px; padding: 8px;
      font: 13px 'Courier New', monospace; color: var(--at-text); z-index: 20;
      align-items: center; max-width: calc(100vw - 24px); flex-wrap: wrap;
    }
    .toolbar .tool {
      background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 5px 10px; cursor: pointer; font: inherit;
    }
    .toolbar .tool--danger { background: var(--at-surface); border-color: var(--at-err); color: var(--at-err); }
    .toolbar .tool--active { background: var(--at-accent); border-color: var(--at-accent); color: #050807; }
    .toolbar .toolbar-hint { color: var(--at-text-dim); padding: 0 4px; }
    .toasts {
      position: fixed; right: 12px; bottom: 12px; display: flex;
      flex-direction: column; gap: 6px; z-index: 10; max-width: 320px; pointer-events: none;
    }
    .toast {
      background: rgba(11,18,14,0.94); color: var(--at-text); border-radius: 3px;
      padding: 8px 12px; font: 14px 'Courier New', monospace; border-left: 4px solid var(--at-accent);
      transition: opacity 0.2s;
    }
    .toast--ok { border-left-color: var(--at-ok); }
    .toast--warn { border-left-color: var(--at-warn); } /* R39 (t_1c21c88e) : tréso/emprunt, lisible sans couleur seule */
    .toast--err { border-left-color: var(--at-err); }
    .toast--out { opacity: 0; transform: translateY(4px); }
    /* Juice (t_5065be95) : animations légères des panneaux — entrées à la
       création/affichage (keyframe rejouée) et sorties des toasts (glissade).
       Le DÉCLENCHEMENT des entrées re-affichées est géré par juice.fx
       (src/ui/juice.mjs, testé) ; le CSS fait seulement l'animation. */
    @keyframes fx-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fx-out {
      from { opacity: 1; }
      to { opacity: 0; transform: translateY(4px); }
    }
    .panel, .planning, .intro, .toast { animation: fx-in 0.18s ease-out; }
    .toast { transition: opacity 0.2s ease, transform 0.2s ease; }
    .fx-enter { animation: fx-in 0.18s ease-out; }
    .fx-exit { animation: fx-out 0.18s ease-in forwards; }
    /* Panneau planning (BL-16) : liste consultable des vols + accepter/refuser.
       T5a (t_e4c3ffff) : lisible — corps 13 px (avant 12), boutons d'action
       12 px / coussin 4 px 10 px (cible ≥40 px), filtres 12 px (avant 10,
       sous la lisibilité minimale) ; fond α0.82 (avant 0.55 : sur le monde
       JOUR clair, le texte secondaire #90a4ae tombait sous 4.5:1). */
    .planning {
      position: fixed; right: 12px; top: 12px; z-index: 10; max-width: 360px;
      background: rgba(5,8,7,0.82); border: 1px solid var(--at-border); border-radius: 3px; padding: 8px;
      font: 13px 'Courier New', monospace; color: var(--at-text);
    }
    .planning h4 { margin: 0 0 4px; color: var(--at-text-dim); font-size: 13px; font-weight: 600; }
    .planning-row { display: flex; gap: 6px; align-items: center; padding: 3px 0; }
    .planning-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .planning-row button {
      background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 12px 'Courier New', monospace;
      white-space: nowrap;
    }
    .planning-row button:last-of-type { border-color: var(--at-err); }
    .planning-empty { color: var(--at-text-dim); font-style: italic; margin: 2px 0; }
    .planning-auto { display: flex; gap: 4px; align-items: center; color: var(--at-text-dim); margin-top: 4px; }
    /* R19 — sections « à décider / en cours » + note de décision + filtres. */
    .planning-sec { margin: 4px 0 2px; color: var(--at-text-dim); font-size: 12px; font-weight: 600; }
    .planning-note { color: var(--at-text-dim); font-style: italic; }
    .planning-filters { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .planning-filter {
      background: var(--at-surface); color: var(--at-text-dim); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 3px 8px; cursor: pointer; font: 12px 'Courier New', monospace;
    }
    .planning-filter.on { background: var(--at-accent); color: #050807; border-color: var(--at-accent); }
    /* Panneaux NONMVP-5 (inspection, bilan, stats, alertes, diagnostic réseau) :
       colonne en bas à droite, sous les toasts ; défile si trop haute. */
    .panels {
      position: fixed; right: 12px; bottom: 64px; z-index: 10;
      display: flex; flex-direction: column; gap: 8px; max-width: 360px;
      max-height: calc(100vh - 90px); overflow-y: auto;
    }
    .panel {
      background: rgba(5,8,7,0.82); border: 1px solid var(--at-border); border-radius: 3px; padding: 8px;
      font: 13px 'Courier New', monospace; color: var(--at-text);
    }
    .panel h4 { margin: 0 0 4px; color: var(--at-text-dim); font-size: 13px; font-weight: 600; }
    .pline { display: flex; gap: 6px; padding: 1px 0; }
    .pline > span { color: var(--at-text-dim); min-width: 110px; flex: none; }
    .pline--good { color: var(--at-ok); }
    .pline--bad { color: var(--at-err); }
    .pline--warn { color: var(--at-warn); }
    .aline { padding: 1px 0; color: var(--at-text-dim); font-size: 12px; }
    /* R20 : carte d'introduction (premier cycle, désactivable) — bas gauche,
       au-dessus de la barre de construction (la barre reste en bas à gauche). */
    .intro {
      position: fixed; left: 12px; bottom: 96px; z-index: 10; max-width: 340px;
      background: rgba(5,8,7,0.82); border: 1px solid var(--at-border); border-radius: 3px;
      padding: 8px; font: 14px 'Courier New', monospace; color: var(--at-text);
    }
    .intro h4 { margin: 0 0 4px; color: var(--at-gold); font-size: 15px; }
    .intro p { margin: 0 0 6px; color: var(--at-text); }
    .intro-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    /* T5a (t_e4c3ffff) : les boutons de l'intro réutilisent l'IDENTITÉ des
       boutons .toolbar .tool (même pattern que R43 « pas de style
       duplicaté ») — sans ça ils restaient en boutons UA par défaut
       (gris clair) sur la carte sombre. */
    .intro .tool {
      background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 4px 10px; cursor: pointer; font: 13px 'Courier New', monospace;
    }
    .intro .tool--danger { background: var(--at-surface); border-color: var(--at-err); color: var(--at-err); }
    /* R35 : écran de faillite (bilan + décisions) — modal plein centre, la
       carte est STOPPÉE derrière (le tick rentre par l'entrée : bankrupt). */
    .bankruptcy {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 30; max-width: 480px; width: calc(100vw - 24px);
      background: rgba(5,8,7,0.97); border: 2px solid var(--at-err); border-radius: 3px;
      padding: 14px; font: 13px 'Courier New', monospace; color: var(--at-text);
    }
    .bankruptcy h4 { margin: 0 0 8px; color: var(--at-err); font-size: 15px; }
    .bankruptcy-statement .kv { display: flex; gap: 8px; padding: 1px 0; }
    .bankruptcy-statement .kv > span:first-child { color: var(--at-text-dim); min-width: 190px; flex: none; }
    .kv--bad > span:last-child { color: var(--at-err); }
    .kv--warn > span:last-child { color: var(--at-warn); }
    .bankruptcy-statement p { margin: 6px 0 8px; color: var(--at-text); font-size: 13px; }
    .bankruptcy-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .bankruptcy-actions .tool {
      background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 6px 12px; cursor: pointer; font: 13px 'Courier New', monospace;
    }
    /* R39 (t_1c21c88e) : ÉCRANS ÉTROITS — la colonne de panneaux (360 px) et
       les toasts (320 px) ne doivent plus COUCHER la carte ni se CHEVAUCHER :
       pleine largeur (marge 8 px), la hauteur reste bornée (défilement) et la
       zone d'atterrissage (canvas) reste jouable. Le reste est déjà fluide
       (toolbar flex-wrap, toasts pointer-events:none).
       ponytail : UN seuil (560 px) + pleine largeur ; on ne fera pas de
       layout responsive multi-brisures tant que le jeu vise d'abord le desktop.
       (À la FIN de la feuille : même spécificité que les règles de base,
       mais après → il gagne.) */
    @media (max-width: 560px) {
      .panels {
        left: 8px; right: 8px; bottom: 56px; max-width: none;
        max-height: calc(100vh - 120px);
      }
      .toasts { left: 8px; right: 8px; bottom: auto; top: 8px; max-width: none; }
      .menu-btns { max-width: 100vw; }
    }

    /* T51 (t_cccfbc97) : CORRECTION DU CHEVAUCHEMENT DES COUCHES — hiérarchie
       z-index EXPLICITE et UNIQUE (un niveau par couche DOM ; le JUICE est
       peint sur le canvas du jeu, il hérite donc du niveau du canvas et est
       pointer-events:none par nature — pixels peints, pas une couche DOM à
       empiler) + layout par ZONES (aucun élément interactif ne masque la
       zone de jeu ni un autre élément interactif) :
       10   = canvas jeu (le monde + HUD + juice y sont peints)
       100  = commandes du menu (.menu-btns)
       101  = planning (.planning) · 102 = consultation (.panels)
       103  = intro (.intro) · 104 = barre de construction (.toolbar)
       500  = toasts (.toasts — transitoires, pointer-events:none)
       1000 = modales (.bankruptcy / .options)
       Zones desktop (sans superposition, bornes mesurées par
       qa/ui-no-overlap-cdp.mjs) : planning HAUTE DROITE (12px → 45vh-8),
       consultation = COLONNE DROITE (45vh+8 → 64px du bas, scroll interne),
       toolbar BAS GAUCHE borné en largeur (384px du bord droit : elle ne
       touche plus la colonne de droite ; hauteur bornée 104px : elle ne
       couvre jamais l'intro), intro BAS GAUCHE (116px du bas = au-dessus de
       la toolbar), toasts = COIN LIBRE BAS DROITE (12 → 64px du bas : sous
       la colonne de consultation, à droite de la toolbar).
       Mobile (≤560px) : pile verticale — planning en haut (25vh), toasts
       juste dessous, intro au-dessus de la feuille de consultation (30vh,
       76px du bas), toolbar en RANGÉE HORIZONTALE unique (44px, scroll).
       Le bloc est à la FIN de la feuille → il gagne sur les règles de base
       à spécificité égale (même convention que le @media ci-dessus). */
    canvas#game { position: relative; z-index: 10; }
    .menu-btns { z-index: 100; }
    .planning { z-index: 101; max-height: calc(45vh - 20px); overflow-y: auto; }
    .panels { z-index: 102; top: calc(45vh + 8px); bottom: 64px; max-height: none; }
    .intro { z-index: 103; bottom: 116px; }
    .toolbar { z-index: 104; right: 384px; box-sizing: border-box; max-height: 104px; overflow-y: auto; }
    .toasts { z-index: 500; max-height: 52px; overflow: hidden; }
    .bankruptcy { z-index: 1000; }
    /* R43 : la page options n'avait AUCUNE règle de position (flow normal,
       invisible) — modale centrée au niveau des modales. */
    .options {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      z-index: 1000; max-width: 420px; width: calc(100vw - 24px);
      max-height: calc(100vh - 48px); overflow-y: auto;
      background: rgba(5,8,7,0.97); border: 1px solid var(--at-border); border-radius: 3px;
      padding: 14px; font: 13px 'Courier New', monospace; color: var(--at-text);
    }
    .options h4 { margin: 0 0 10px; color: var(--at-gold); font-size: 15px; }
    .options .opt-row { margin: 6px 0; }
    .options .opt-label { display: flex; align-items: center; gap: 8px; }
    .options .opt-name { color: var(--at-text-dim); flex: 1; }
    .options .opt-value { color: var(--at-text); min-width: 56px; text-align: right; font: 13px 'Courier New', monospace; }
    .options .opt-volume { width: 140px; accent-color: var(--at-accent); }
    .options .opt-speeds { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .options .tool {
      background: var(--at-surface); color: var(--at-text); border: 1px solid var(--at-border);
      border-radius: 3px; padding: 6px 12px; cursor: pointer; font: 13px 'Courier New', monospace;
    }
    .options .tool[aria-pressed="true"] { background: var(--at-accent); border-color: var(--at-accent); color: #050807; }
    /* T5c (t_bd4726e7) : DESIGN TOKENS v2 « RADAR RÉTRO » — source
       UNIQUE = src/ui/theme.mjs (ce bloc les MIRE, le test t4-theme vérifie
       la cohérence : un token changé d'un côté DOIT l'être de l'autre). */
    :root {
      --at-bg: #050807;
      --at-surface: #0B120E;
      --at-surface-alt: #0F1A12;
      --at-border: #1C5233;
      --at-text: #B9F5CE;
      --at-text-dim: #8FD6AE;
      --at-accent: #3DFFA5;
      --at-accent-soft: rgba(61,255,165,0.12);
      --at-ok: #3DFFA5;
      --at-warn: #FFD24A;
      --at-err: #FF5A4E;
      --at-gold: #FFC94A;
    }
    html, body { background: var(--at-bg); } /* noir phosphore (le canvas couvre l'écran, le fond reste discret) */
    /* T4 : ASTUCES d'onboarding (tips.mjs) — toasts dorés, une seule fois
       (persistance state.tips.seen) ; la zone .toasts reste dédiée (T51). */
    .toast--tip {
      border-left-color: var(--at-gold);
      background: var(--at-surface-alt);
      box-shadow: 0 0 0 1px var(--at-accent-soft);
    }
    .toast--tip .tip-title { color: var(--at-gold); font-weight: 600; }
    /* T4 : icônes vectorielles (icons.mjs) dans les boutons de construction
       et du menu — 18-20 px, jamais de texte dupliqué. */
    .tool .icon, .menu-diff .icon { margin-right: 6px; vertical-align: -4px; }
    /* T5c : boutons du menu — filet d'accent PHOSPHORE + survol (v2 :
       l'accent cyan « balise de tour » est remplacé par le phosphore CRT). */
    .menu-btns .tool {
      border-top: 2px solid transparent;
      transition: border-color 0.15s ease, background 0.15s ease;
    }
    .menu-btns .tool:hover { border-top-color: var(--at-accent); background: var(--at-surface-alt); }
    .menu-btns .tool[aria-pressed="true"] { border-top-color: var(--at-gold); }
    /* T5a (t_e4c3ffff) : DECISION DE LAYOUT MOBILE PORTRAIT (≤560px) — le bug
       connu : le bandeau planning PLEINE LARGEUR en haut (25vh) COUVRAIT le
       HUD canvas peint en haut à gauche (zone canvas = sous les panneaux,
       illisible à 390×844). La correction (structure seule, zéro nouvelle
       identité, zéro règle de jeu) :
       HAUT   : stripe planning PLEINE LARGEUR (top 8px, bornée à 22vh,
                scroll interne — les lignes + boutons restent accessibles)
               + le HUD CANVAS est peint SOUS la stripe par le renderer
                (drawHud, src/ui/renderer.mjs : y = 8 + .planning.offsetHeight
                + 8 ; police 14px ≥11px ; largeur = plus longue ligne).
       MILIEU : zone canvas LIBRE (le monde + le HUD + les toasts y transitent ;
               les toasts : au-dessus de la consultation, pointer-events:none,
               transitoires 4 s — NON BLOQUANTS).
       BAS    : feuille de consultation PLEINE LARGEUR (30vh, scroll interne,
                polices 13px) + toolbar en RANGÉE HORIZONTALE unique (48px,
                scroll horizontal, boutons 13px) + intro au-dessus de la pile.
       Le bloc est à la FIN de la feuille → il gagne sur les règles de base
       à spécificité égale (même convention que les @media ci-dessus). */
    @media (max-width: 560px) {
      .planning { left: 8px; right: 8px; top: 8px; max-width: none; max-height: 22vh; overflow-y: auto; }
      .toasts { left: 8px; right: 8px; top: calc(22vh + 40px); bottom: auto; max-width: none; max-height: 40vh; overflow: hidden; }
      /* T5a : intro COMPACTE en mobile — la zone milieu de 390×844 est
         tendue (bande planning 8..~207 → HUD canvas ~215..378 → pile
         consultation 515..768) et l'intro à hauteur naturelle (~150px)
         CHEVAUCHAIT le HUD (4716 px² mesurés). Correction : 13 px
         (lisible, = la police souhaitée) + cap 116px à scroll interne →
         l'intro est à ~391..507, jamais sur le HUD même au pire cas
         (8 lignes + PAUSE : bas du HUD ~386, marge 5 px). */
      .intro { left: 8px; right: 8px; bottom: calc(30vh + 84px); max-width: none; max-height: 116px; box-sizing: border-box; overflow-y: auto; padding: 6px; }
      .intro h4 { font-size: 13px; margin: 0 0 2px; }
      .intro p { font-size: 13px; line-height: 1.2; margin: 0 0 2px; }
      .intro-actions { margin-top: 2px; gap: 4px; }
      .intro .tool { font-size: 12px; padding: 3px 8px; }
      .panels { left: 8px; right: 8px; top: auto; bottom: 76px; max-width: none; max-height: 30vh; overflow-y: auto; }
      .toolbar { left: 8px; right: 8px; bottom: 12px; max-width: none; box-sizing: border-box; max-height: 48px; flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; }
      .menu-btns { max-width: 100vw; }
    }

    /* ============================================================
    T6 (t_87168414) : MOBILE JOUABLE — tactile
    - canvas#game : touch-action:none (le navigateur ne préempte ni le
      scroll ni le zoom de page pendant les gestes pan/pinch/tap) ;
    - bandes planning / consultation : REPLIABLES (accordion) et repliées
      PAR DÉFAUT sur mobile (JS : matchMedia) → la map garde ≥60 % de la
      hauteur ; le bouton .fold (cible 44×44 px) déplie le contenu
      (22vh / 30vh, défilement interne) ;
    - toolbar : cibles tactiles ≥44×44 px (défilement horizontal T5a) ;
    - toasts : zone libre (jamais au-dessus d'un élément interactif),
      sous la bande planning repliée ; déplacés quand elle est dépliée.
    Desktop : .fold est masqué (display:none) — les bandes restent
    toujours visibles, le comportement desktop est intact.
    ============================================================ */
    .fold { display: none; }
    @media (max-width: 560px) {
      canvas#game { touch-action: none; }
      .fold {
        display: flex; align-items: center; box-sizing: border-box;
        width: 100%; min-height: 44px; padding: 0 12px;
        background: var(--at-surface); color: var(--at-text);
        border: none; cursor: pointer; text-align: left;
        font: 13px 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase;
      }
      /* Cibles tactiles ≥44×44 (boutons de la toolbar, intro, menu) */
      .toolbar .tool { min-width: 44px; min-height: 44px; flex: none; padding: 4px 8px; }
      .toolbar .toolbar-hint { display: none; }
      .intro .tool { min-width: 44px; min-height: 44px; }
      .menu-btns .tool { min-width: 44px; min-height: 44px; }
      /* Planning : replié = la ligne du bouton (44 px) ; déplié = 22vh scrollé
         (T5a) — repli par défaut géré par le JS (matchMedia), non ici. */
      .planning { max-height: 44px; overflow: hidden; padding: 0; }
      .planning.open { max-height: 22vh; overflow-y: auto; padding: 8px; }
      .planning:not(.open) > :not(.fold) { display: none; }
      /* Consultation : replié = la ligne du bouton ; déplié = 30vh scrollé */
      .panels { max-height: 44px; overflow: hidden; }
      .panels.open { max-height: 30vh; overflow-y: auto; }
      .panels:not(.open) > :not(.fold) { display: none; }
      /* Toasts : zone libre sous la bande repliée (12+44 → top 56) ;
         quand le planning est déplié, ils passent SOUS la bande dépliée
         (12px de top de base + 22vh de contenu + 16px de marge). */
      .toasts { top: 56px; bottom: auto; max-height: 20vh; overflow-y: auto; }
      body.plan-open .toasts { top: calc(12px + 22vh + 16px); }
      /* Intro : position T5a conservée (bottom: calc(30vh + 84px), y≈391-507) —
         elle reste 8 px au-dessus de la bande consultation DÉPLIÉE (30vh) et
         117 px au-dessus de la bande repliée (y≈724). Un recentrage « pile
         basse » (calc(44+48+22) = 114 px) a CHEVAUCHÉ la bande repliée
         (top y=724 → 6 px × 374 = 2244 px², QA ui-no-overlap en échec) :
         la pile basse s'étend de 76 à 120 px du bas, pas 44+48. */
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <script type="module" src="./src/main.mjs"></script>
</body>
</html>
